        /* Animações Reveal */
        .reveal {

        }
        .reveal-right {

            transform: translateX(40px);
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.active, .reveal-left.active, .reveal-right.active {

                    root: null,
                    threshold: 0.1,
                    rootMargin: "0px 0px -50px 0px"
                };

                const revealObserver = new IntersectionObserver((entries, observer) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('active');
                            observer.unobserve(entry.target);
                        }
                    });
                }, observerOptions);

                setTimeout(() => {
                    document.querySelectorAll('.reveal, .reveal-left, .reveal-right').forEach(el => {
                        revealObserver.observe(el);
                    });
                }, 100);

                const handleParallax = () => {
                    if (!ticking) {
                        window.requestAnimationFrame(() => {
                            const wrappers = document.querySelectorAll('.parallax-wrapper');
                            wrappers.forEach(wrapper => {
                                const parent = wrapper.parentElement;
                                if (!parent) return;
                                
                                const rect = parent.getBoundingClientRect();
                                const windowHeight = window.innerHeight;
                                
                                if (rect.top <= windowHeight && rect.bottom >= 0) {
                                    const offset = (windowHeight / 2) - (rect.top + rect.height / 2);
                                    const speed = parseFloat(wrapper.getAttribute('data-speed')) || 0.15;
                                    const yPos = offset * speed;
                                    wrapper.style.transform = `translate3d(0, ${yPos}px, 0)`;
                                }
                            });
                            ticking = false;
                        });
                        ticking = true;
                    }
                };

                window.addEventListener('scroll', handleParallax, { passive: true });
                window.addEventListener('resize', handleParallax, { passive: true });
                setTimeout(handleParallax, 50);

                    window.removeEventListener('scroll', handleParallax);

                        <section id="faq" className="py-20 md:py-28 bg-hiro-secondary relative overflow-hidden border-t border-white/5">
                            <div className="max-w-4xl mx-auto px-6 lg:px-8 relative z-20 reveal">
                                <h2 className="text-3xl md:text-5xl font-black uppercase tracking-tight text-white mb-12 text-center text-balance">Dúvidas sobre a Conformidade NR-1?</h2>
                                <div className="space-y-4">
                                    {faqs.map((faq, i) => (
                                        <div 
                                            key={i} 
                                            className={`glass-card rounded-2xl cursor-pointer transition-all duration-300 overflow-hidden border ${openFAQ === i ? 'border-hiro-primary shadow-[0_0_20px_rgba(80,168,251,0.1)]' : 'border-white/10 hover:border-white/30'}`}
                                            onClick={() => setOpenFAQ(openFAQ === i ? null : i)}
                                        >
                                            <div className="flex justify-between items-center p-6 sm:p-8 font-bold text-lg text-white">
                                                <span className="pr-4">{faq.q}</span>
                                                <i className={`ph-bold ph-caret-down text-xl transition-transform duration-300 shrink-0 ${openFAQ === i ? 'rotate-180 text-hiro-primary' : 'text-gray-400'}`}></i>
                                            </div>
                                            <div className={`overflow-hidden transition-all duration-300 bg-hiro-secondaryDark/50 ${openFAQ === i ? 'max-h-64 opacity-100' : 'max-h-0 opacity-0'}`}>
                                                <div className="p-6 sm:p-8 pt-0 text-gray-300 font-medium leading-relaxed border-t border-white/5 mt-2 text-sm md:text-base">
                                                    {faq.a}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </section>

                        {/* --- 9. CTA FINAL / FORMULARIO --- */}
                        <section id="contato" className="py-24 md:py-32 bg-[#122639] relative overflow-hidden border-t border-white/5">
                            <div className="absolute top-0 left-[-50%] w-[200%] h-full bg-gradient-to-r from-transparent via-white/5 to-transparent transform -skew-x-12 translate-x-full animate-[shine_5s_infinite] pointer-events-none"></div>
                            <div className="absolute inset-0 bg-gradient-to-t from-hiro-secondaryDark to-transparent z-0 pointer-events-none"></div>
                            
                            <div className="max-w-6xl mx-auto px-6 lg:px-8 relative z-20 flex flex-col lg:flex-row gap-16 items-center">
                                
                                <div className="w-full lg:w-1/2 reveal-left">
                                    <h2 className="text-4xl md:text-5xl lg:text-6xl font-black text-white mb-6 leading-tight uppercase tracking-tighter text-balance">
                                        Dar o próximo passo leva <br/>
                                        <span className="text-hiro-primary">menos de um minuto</span>
                                    </h2>
                                    
                                    <div className="mt-12 space-y-10">
                                        <div className="flex gap-6">
                                            <div className="w-14 h-14 rounded-2xl border-2 border-hiro-primary text-hiro-primary flex items-center justify-center font-black text-2xl shrink-0 bg-hiro-primary/10">1</div>
                                            <div>
                                                <h3 className="text-2xl font-black text-white mb-3 uppercase tracking-wide">Preencha o formulário</h3>
                                                <p className="text-gray-300 leading-relaxed font-medium text-lg text-pretty">Envie suas informações corporativas. Todos os seus dados estarão seguros e protegidos pela nossa criptografia.</p>
                                            </div>
                                        </div>
                                        <div className="flex gap-6">
                                            <div className="w-14 h-14 rounded-2xl border-2 border-hiro-primary text-hiro-primary flex items-center justify-center font-black text-2xl shrink-0 bg-hiro-primary/10">2</div>
                                            <div>
                                                <h3 className="text-2xl font-black text-white mb-3 uppercase tracking-wide">Receba uma ligação</h3>
                                                <p className="text-gray-300 leading-relaxed font-medium text-lg text-pretty">Um dos nossos diretores fará uma ligação para entender seu cenário e agendar uma demonstração do copiloto.</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="w-full lg:w-1/2 reveal-right delay-200 max-w-md mx-auto lg:max-w-none">
                                    <div className="glass-card p-8 md:p-12 rounded-[2.5rem] shadow-2xl border-t-2 border-white/10 hover:border-hiro-primary/40 transition-colors duration-500 relative group overflow-hidden bg-hiro-secondary/30">
                                        <div className="absolute -inset-2 bg-gradient-to-r from-transparent via-hiro-primary/10 to-transparent rotate-45 opacity-0 group-hover:opacity-100 transition-opacity duration-1000 animate-[shine_4s_infinite] pointer-events-none"></div>

                                        <form className="space-y-6 relative z-10" onSubmit={handleSubmit}>
                                            <div>
                                                <label className="block text-xs font-bold text-gray-300 uppercase mb-2 tracking-wider">Nome Completo</label>
                                                <input type="text" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full px-5 py-4 rounded-xl bg-hiro-secondaryDark/80 border border-gray-600/50 text-white focus:outline-none focus:border-hiro-primary transition-all shadow-inner text-sm" />
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                <div>
                                                    <label className="block text-xs font-bold text-gray-300 uppercase mb-2 tracking-wider">E-mail Corporativo</label>
                                                    <input type="email" required value={formData.email} onChange={e => setFormData({...formData, email: e.target.value})} className="w-full px-5 py-4 rounded-xl bg-hiro-secondaryDark/80 border border-gray-600/50 text-white focus:outline-none focus:border-hiro-primary transition-all shadow-inner text-sm" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-gray-300 uppercase mb-2 tracking-wider">WhatsApp</label>
                                                    <input type="tel" required value={formData.whatsapp} onChange={e => setFormData({...formData, whatsapp: e.target.value})} className="w-full px-5 py-4 rounded-xl bg-hiro-secondaryDark/80 border border-gray-600/50 text-white focus:outline-none focus:border-hiro-primary transition-all shadow-inner text-sm" />
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                <div>
                                                    <label className="block text-xs font-bold text-gray-300 uppercase mb-2 tracking-wider">Cargo</label>
                                                    <input type="text" required value={formData.role} onChange={e => setFormData({...formData, role: e.target.value})} className="w-full px-5 py-4 rounded-xl bg-hiro-secondaryDark/80 border border-gray-600/50 text-white focus:outline-none focus:border-hiro-primary transition-all shadow-inner text-sm" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-gray-300 uppercase mb-2 tracking-wider">Empresa</label>
                                                    <input type="text" required value={formData.company} onChange={e => setFormData({...formData, company: e.target.value})} className="w-full px-5 py-4 rounded-xl bg-hiro-secondaryDark/80 border border-gray-600/50 text-white focus:outline-none focus:border-hiro-primary transition-all shadow-inner text-sm" />
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-gray-300 uppercase mb-2 tracking-wider">Número de funcionários</label>
                                                <select required value={formData.size} onChange={e => setFormData({...formData, size: e.target.value})} className="w-full px-5 py-4 rounded-xl bg-hiro-secondaryDark/80 border border-gray-600/50 text-white focus:outline-none focus:border-hiro-primary transition-all shadow-inner text-sm cursor-pointer appearance-none">
                                                    <option value="" disabled>Selecione o tamanho da empresa</option>
                                                    <option value="1-49">1 a 49 funcionários</option>
                                                    <option value="50-99">50 a 99 funcionários</option>
                                                    <option value="100-499">100 a 499 funcionários</option>
                                                    <option value="500+">Acima de 500 funcionários</option>
                                                </select>
                                            </div>
                                            <div className="pt-4">
                                                <button type="submit" className="btn-shine w-full bg-hiro-green text-hiro-secondaryDark hover:bg-hiro-greenHover font-black uppercase tracking-widest py-5 rounded-xl text-lg transition-all transform hover:-translate-y-1 hover:shadow-[0_10px_30px_rgba(0,209,142,0.4)] flex justify-center items-center gap-3">
                                                    Solicitar contato
                                                    <i className="ph-bold ph-paper-plane-right text-2xl"></i>
                                                </button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* FOOTER */}
                        <footer className="bg-[#0b1622] text-gray-500 py-12 md:py-16 text-center text-sm border-t border-white/5">
                            <div className="max-w-7xl mx-auto px-6 flex flex-col items-center">
                                <a href="#inicio" onClick={(e) => scrollToSection(e, 'inicio')} className="mb-10 transition-transform duration-500 inline-block hover:scale-105">
                                    <img 
                                        src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663112691788/BxsOqkAxwEutpZHT.png" 
                                        alt="HIRO Logo" 
                                        className="h-12 sm:h-16 lg:h-20 w-auto brightness-0 invert opacity-80 hover:opacity-100 transition-opacity duration-300" 
                                    />
                                </a>
                                <p className="mb-3 font-bold text-gray-400 uppercase tracking-widest text-xs">HIRO GOVERNANCE TECH - Inteligência Humana e Otimização Responsável</p>
                                <p className="mb-8 font-medium text-xs">Todos os direitos reservados © 2026</p>
                            </div>
                        </footer>

                    </div> {/* Fim Wrapper Sombra Superior */}

                    {/* --- MODAL DE VÍDEO --- */}
                    {isVideoModalOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-hiro-secondaryDark/95 backdrop-blur-sm p-4">
                            <div className="bg-black w-full max-w-4xl aspect-video relative rounded-2xl overflow-hidden shadow-2xl border border-gray-700 animate-[reveal_0.3s_ease-out] active">
                                <button 
                                    onClick={() => setIsVideoModalOpen(false)}
                                    className="absolute top-6 right-6 z-20 text-white bg-white/10 hover:bg-hiro-primary hover:text-white w-12 h-12 flex items-center justify-center rounded-full transition-colors backdrop-blur-md"
                                >
                                    <i className="ph-bold ph-x text-2xl"></i>
                                </button>
                                
                                <div className="absolute inset-0 flex flex-col items-center justify-center bg-hiro-secondaryDark text-gray-400">
                                    <i className="ph-fill ph-play-circle text-6xl text-hiro-primary/50 mb-4 animate-pulse"></i>
                                    <p className="font-bold uppercase tracking-widest text-sm">Vídeo Demonstrativo HIRO rodando...</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HiroApp />);
    </script>
</body>
</html>
